<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>School and Toy Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap">
<style>
  /* Layout: một cột giữa trang, mỗi màn hình là một thẻ lớn; thanh tiến độ 10 đoạn ở đầu màn chơi */
  :root {
    --bg: #d9f0ff;
    --blob1: #ffe58a;
    --blob2: #b9e3ff;
    --card: #ffffff;
    --ink: #26235a;
    --muted: #5a5890;
    --line: #c6dcf3;
    --slot: #eaf4ff;
    --grape: #6a4cf5;
    --sun: #ffc933;
    --sun-edge: #d99a00;
    --on-sun: #2b2560;
    --good: #12996a;
    --good-bg: #d4f4e5;
    --bad: #dc4059;
    --bad-bg: #ffe0e5;
    --imgbg: #ffffff;
    --display: 'Baloo 2', 'Nunito', system-ui, sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16143d;
      --blob1: #2d2670;
      --blob2: #1c2c66;
      --card: #24215e;
      --ink: #f3f1ff;
      --muted: #bab7ef;
      --line: #3b3893;
      --slot: #1b1950;
      --grape: #9a84ff;
      --good: #43dd9b;
      --good-bg: #134438;
      --bad: #ff7f93;
      --bad-bg: #4d2040;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16143d;
    --blob1: #2d2670;
    --blob2: #1c2c66;
    --card: #24215e;
    --ink: #f3f1ff;
    --muted: #bab7ef;
    --line: #3b3893;
    --slot: #1b1950;
    --grape: #9a84ff;
    --good: #43dd9b;
    --good-bg: #134438;
    --bad: #ff7f93;
    --bad-bg: #4d2040;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(420px 320px at 8% 4%, var(--blob1), transparent 70%),
      radial-gradient(520px 380px at 96% 30%, var(--blob2), transparent 70%),
      var(--bg);
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
  [hidden] { display: none !important; }

  .brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .logo { font: 800 1.9rem/1.1 var(--display); letter-spacing: .01em; }
  .logo i { font-style: normal; color: var(--grape); }
  .tag { font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .card {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 26px;
    box-shadow: 0 7px 0 var(--line);
    padding: 22px 20px;
    min-width: 0;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
  p { margin: 0; }

  .btn {
    font: 800 1.2rem/1 var(--display);
    background: var(--sun);
    color: var(--on-sun);
    border: 0;
    border-radius: 999px;
    padding: .85rem 1.7rem .8rem;
    box-shadow: 0 5px 0 var(--sun-edge);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--sun-edge); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-edge); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--sun-edge); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 3px var(--line); }
  .btn.ghost:hover { box-shadow: inset 0 0 0 3px var(--grape); transform: none; }
  :focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

  /* Màn bắt đầu */
  .tiles { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .tiles div {
    flex: 1 1 0; max-width: 104px; aspect-ratio: 1; background: var(--imgbg);
    border: 3px solid var(--line); border-radius: 18px; display: grid; place-items: center; overflow: hidden;
  }
  .tiles div:nth-child(1) { transform: rotate(-5deg); }
  .tiles div:nth-child(2) { transform: rotate(3deg) translateY(4px); }
  .tiles div:nth-child(3) { transform: rotate(-3deg); }
  .tiles div:nth-child(4) { transform: rotate(5deg) translateY(4px); }
  .tiles img { width: 92%; height: 92%; object-fit: contain; }
  .start h1 { font-size: 2.1rem; text-align: center; }
  .start .lead { text-align: center; color: var(--muted); margin: 8px auto 20px; max-width: 34ch; }
  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field label { font-weight: 800; }
  .text {
    width: 100%; font: 700 1.3rem var(--body); color: var(--ink); background: var(--slot);
    border: 3px solid var(--line); border-radius: 16px; padding: .7rem 1rem;
  }
  .text:focus { outline: none; border-color: var(--grape); }
  .text::placeholder { color: var(--muted); opacity: .7; font-weight: 400; }
  .err { color: var(--bad); font-weight: 800; min-height: 1.5em; }
  .start .btn { width: 100%; }
  .rules { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-top: 16px; font-size: .9rem; color: var(--muted); font-weight: 700; }

  /* Màn chơi */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-weight: 800; }
  .top .who { overflow-wrap: anywhere; }
  .top .no { font: 800 1.1rem var(--display); background: var(--slot); border-radius: 999px; padding: 2px 14px; white-space: nowrap; }
  .seg { display: flex; gap: 3px; margin-bottom: 16px; }
  .seg b { flex: 1 1 0; min-width: 0; height: 10px; border-radius: 6px; background: var(--line); }
  .seg b.now { background: var(--grape); }
  .seg b.ok { background: var(--good); }
  .seg b.no { background: var(--bad); }

  .pic {
    background: var(--imgbg); border: 3px solid var(--line); border-radius: 20px;
    display: grid; place-items: center; padding: 10px; margin-bottom: 14px; min-height: 190px;
  }
  .pic img { max-width: 100%; height: 170px; object-fit: contain; }
  .vi { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .vi b { color: var(--ink); font: 800 1.35rem var(--display); background: var(--sun); color: var(--on-sun); padding: 0 12px; border-radius: 10px; margin-left: 4px; }
  .sent { text-align: center; font-size: 1.15rem; font-weight: 700; margin: 12px 0 14px; text-wrap: balance; }
  .sent .blank { display: inline-block; min-width: 4.5ch; border-bottom: 4px dashed var(--grape); margin: 0 4px; }
  .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-bottom: 16px; }
  .slots .w { display: flex; gap: 4px; }
  .slots span {
    width: 1.9rem; height: 2.4rem; border-radius: 9px; background: var(--slot); border: 2px solid var(--line);
    display: grid; place-items: center; font: 800 1.3rem var(--display); text-transform: uppercase;
  }
  .slots span.first { background: var(--sun); border-color: var(--sun-edge); color: var(--on-sun); }
  .answer-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
  .answer-row .text { text-align: center; }
  .fb { margin-top: 14px; border-radius: 16px; padding: 12px 16px; font-weight: 800; text-align: center; }
  .fb.good { background: var(--good-bg); color: var(--good); }
  .fb.bad { background: var(--bad-bg); color: var(--bad); }
  .fb.warn { background: var(--slot); color: var(--muted); }
  .next { margin-top: 14px; display: flex; justify-content: center; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

  /* Kết quả */
  .res { display: grid; justify-items: center; text-align: center; gap: 10px; }
  .ring {
    --p: 0; width: 170px; height: 170px; border-radius: 50%;
    background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--line) 0);
    display: grid; place-items: center;
  }
  .ring div { width: 136px; height: 136px; border-radius: 50%; background: var(--card); display: grid; place-content: center; }
  .ring strong { font: 800 3.2rem/1 var(--display); }
  .ring small { font: 800 1.2rem var(--display); color: var(--muted); }
  .stars { font-size: 1.8rem; letter-spacing: .15em; color: var(--sun); text-shadow: 0 2px 0 var(--sun-edge); }
  .stars .off { color: var(--line); text-shadow: none; }
  .res h2 { font-size: 1.7rem; }
  .res p { color: var(--muted); font-weight: 700; }
  .res .acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
  .rv-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 14px; }
  .rv-head h3 { font-size: 1.45rem; }
  .rv-head span { color: var(--muted); font-weight: 700; }
  .rv { display: grid; gap: 12px; }
  .rv li { list-style: none; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: var(--slot); border-radius: 18px; padding: 10px 12px; }
  .rv ul { margin: 0; padding: 0; display: grid; gap: 12px; }
  .rv .th { background: var(--imgbg); border-radius: 12px; height: 76px; display: grid; place-items: center; }
  .rv .th img { max-width: 100%; max-height: 70px; object-fit: contain; }
  .rv .meta { min-width: 0; display: grid; gap: 2px; }
  .rv .n { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .rv .mine { color: var(--bad); font-weight: 800; }
  .rv .mine s { text-decoration-thickness: 3px; overflow-wrap: anywhere; }
  .rv .right { color: var(--good); font: 800 1.35rem/1.2 var(--display); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rv .sentence { color: var(--muted); font-size: .9rem; }
  .say { font: 800 .8rem var(--body); border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .say:hover { border-color: var(--grape); }
  .perfect { text-align: center; padding: 8px 0 4px; font: 800 1.3rem var(--display); color: var(--good); }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
  .confetti i:nth-child(5n) { background: var(--sun); }
  .confetti i:nth-child(5n+1) { background: var(--grape); }
  .confetti i:nth-child(5n+2) { background: var(--good); }
  .confetti i:nth-child(5n+3) { background: var(--bad); }
  .confetti i:nth-child(5n+4) { background: #4cb8ff; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 440px) {
    .logo { font-size: 1.6rem; }
    .rv li { grid-template-columns: 76px 1fr; }
    .slots span { width: 1.6rem; height: 2.1rem; font-size: 1.1rem; }
    .answer-row { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake, .confetti i { animation: none; }
    .btn { transition: none; }
  }
</style>

<main class="wrap">
  <header class="brand">
    <div class="logo">What is <i>it</i>?</div>
    <div class="tag">Fill in the word · Grades 3–5</div>
  </header>

  <!-- Bắt đầu -->
  <section id="s-start" class="card start">
    <div class="tiles" id="tiles"></div>
    <h1>How many words do you know?</h1>
    <p class="lead">Look at the picture, read the clue, and type the missing word. There are 20 questions. Have fun!</p>
    <form id="f-start" novalidate>
      <div class="field">
        <label for="name">What is your name?</label>
        <input id="name" class="text" type="text" maxlength="24" autocomplete="off" placeholder="Example: Minh Anh">
        <div class="err" id="name-err" role="alert"></div>
      </div>
      <button class="btn" type="submit">Start playing</button>
    </form>
    <div class="rules"><span>20 questions</span><span>Lowercase is fine</span><span>Review mistakes at the end</span></div>
  </section>

  <!-- Đang chơi -->
  <section id="s-quiz" class="card" hidden>
    <div class="top"><span class="who" id="who"></span><span class="no" id="no"></span></div>
    <div class="seg" id="seg" aria-hidden="true"></div>
    <div class="pic"><img id="q-img" alt="Picture of an object"></div>
    <p class="vi">Vietnamese: <b id="q-vi"></b></p>
    <p class="sent" id="q-sent"></p>
    <div class="slots" id="slots" aria-label="Letter hints"></div>
    <form id="f-ans" novalidate>
      <div class="answer-row">
        <input id="answer" class="text" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type the English word" placeholder="Type the word">
        <button class="btn" id="check" type="submit">Check</button>
      </div>
    </form>
    <div class="fb" id="fb" role="status" aria-live="polite" hidden></div>
    <div class="next" id="next-wrap" hidden><button class="btn" id="next" type="button">Next question</button></div>
  </section>

  <!-- Kết quả -->
  <section id="s-result" hidden>
    <div class="card res" id="res"></div>
  </section>
  <section id="s-review" class="card" hidden></section>
</main>

const $ = id => document.getElementById(id);
const norm = s => String(s).toLowerCase().replace(/[^a-z]/g, '');
const isRight = (q, val) => q.ok.some(a => norm(a) === norm(val));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let name = '', order = [], idx = 0, log = [], checked = false;

// ảnh xem trước ở màn bắt đầu
['bag', 'ball', 'robot', 'pencil-case'].forEach(k => {
  const d = document.createElement('div'); const im = document.createElement('img');
  im.src = IMG[k]; im.alt = ''; d.appendChild(im); $('tiles').appendChild(d);
});

$('f-start').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('name').value.trim();
  if (!v) { $('name-err').textContent = 'Please type your name before you play!'; $('name').focus(); return; }
  $('name-err').textContent = '';
  name = v; begin();
});

function begin() {
  order = shuffle(Q); idx = 0; log = [];
  $('who').textContent = 'Hi ' + name + '!';
  const seg = $('seg'); seg.textContent = '';
  for (let i = 0; i < order.length; i++) seg.appendChild(document.createElement('b'));
  show('s-quiz'); render();
}

function render() {
  const q = order[idx]; checked = false;
  $('no').textContent = 'Question ' + (idx + 1) + '/' + order.length;
  [...$('seg').children].forEach((b, i) => { b.className = i < log.length ? (log[i].ok ? 'ok' : 'no') : (i === idx ? 'now' : ''); });
  $('q-img').src = IMG[q.k];
  $('q-vi').textContent = q.vi;
  const s = $('q-sent'); s.textContent = q.pre + ' '; const bl = document.createElement('span'); bl.className = 'blank'; bl.innerHTML = '&nbsp;'; s.appendChild(bl); s.appendChild(document.createTextNode('.'));
  const sl = $('slots'); sl.textContent = '';
  q.a.split(' ').forEach(w => {
    const g = document.createElement('div'); g.className = 'w';
    [...w].forEach((ch, i) => { const c = document.createElement('span'); if (i === 0) { c.className = 'first'; c.textContent = ch; } else if (ch === '-') { c.textContent = '-'; } g.appendChild(c); });

  const inp = $('answer'); inp.value = ''; inp.disabled = false; $('check').disabled = false;

function fb(cls, text) { const f = $('fb'); f.className = 'fb ' + cls; f.textContent = text; f.hidden = false; }

$('f-ans').addEventListener('submit', e => {

  if (checked) return;

    const r = document.querySelector('.answer-row'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake');

  }
  checked = true;

  log.push({ q, given: val.trim(), ok });
  $('seg').children[idx].className = ok ? 'ok' : 'no';
  $('answer').disabled = true; $('check').disabled = true;
  if (ok) fb('good', pick(['Correct! Great job!', 'Yes! You are awesome!', 'Hooray! That is right!']));

const pick = a => a[Math.floor(Math.random() * a.length)];

    const d = document.createElement('div'); d.className = 'perfect'; d.textContent = 'You did not miss any question. Fantastic!'; rv.appendChild(d);
  } else {
    const ul = document.createElement('ul'); ul.style.cssText = 'margin:0;padding:0;display:grid;gap:12px';
    wrong.forEach(l => {
      const num = log.indexOf(l) + 1;
      const li = document.createElement('li');
      li.innerHTML = '<div class="th"><img alt=""></div><div class="meta"><span class="n"></span><span class="mine"></span><span class="right"></span><span class="sentence"></span></div>';
      li.querySelector('img').src = IMG[l.q.k];
      li.querySelector('.n').textContent = 'Question ' + num + ' · ' + l.q.vi;
      const mine = li.querySelector('.mine'); mine.append('You wrote: '); const s = document.createElement('s'); s.textContent = l.given; mine.appendChild(s);
      const right = li.querySelector('.right'); right.append('Answer: ' + (l.q.ok.length > 1 ? l.q.ok.join(' / ') : l.q.a));
      if ('speechSynthesis' in window) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'say'; b.textContent = 'Listen';
        b.onclick = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(l.q.a); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} };
        right.appendChild(b);
      }
      li.querySelector('.sentence').textContent = l.q.pre + ' ' + l.q.a + '.';
      ul.appendChild(li);
    });
    rv.appendChild(ul);
  }
  show(['s-result', 's-review']);
  if (score / total >= 0.8) confetti();
}

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 36; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
    p.style.animationDelay = Math.random() * .8 + 's';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
}
</script>
